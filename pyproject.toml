[project]
name = "lha"
version = "0.1.0"
description = "Long-horizon agents with explicit mutable state instead of ever-growing history"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
lha = "lha.cli:main"

[tool.setuptools.packages.find]
include = ["lha*"]
