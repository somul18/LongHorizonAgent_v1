[project]
name = "lha"
version = "0.1.0"
description = "An AI agent that turns plain-English design requests into validated 3D CAD parts, staying accurate through thousands of engineering changes by keeping a small working state instead of a growing transcript."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34", "anthropic[bedrock]>=1.0"]
cad = ["build123d>=0.9"]
dev = ["pytest>=8"]

[project.scripts]
lha = "lha.cli:main"

[tool.setuptools.packages.find]
include = ["lha*"]

[tool.setuptools.package-data]
lha = ["ui/index.html"]
